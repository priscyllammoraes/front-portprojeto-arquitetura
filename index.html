<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfólio de Projetos</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="icon" href="imagens/favicon.png" type="image/png">
</head>
<body>
  <div class="layout">
    <header>
      <div class="header-left">
        <img src="../imagens/logo2.png" alt="Logo" class="logo-header" />
        <h2></h2>
      </div>
      <button id="toggleSidebar" class="menu-toggle">☰</button>
    </header> 

    <aside class="sidebar-overlay" id="sidebar">
      <div class="sidebar-header">
        <h3>Menu</h3>
        <!--<button class="close-btn" onclick="fecharSidebar()"></button>-->
      </div>
      <ul class="sidebar-menu">
        <li><a href="#" onclick="loadPage('home')">Home</a></li>
        <li class="submenu">
          <span>Projetos</span>
          <ul class="submenu-items">
            <li><a href="#" onclick="loadPage('cadastro-projeto.html')">Cadastrar</a></li>
            <li><a href="#" onclick="loadPage('projetos.html')">Listar</a></li>
          </ul>
        </li>
        <li class="submenu">
          <span>Recursos</span>
          <ul class="submenu-items">
            <li><a href="#" onclick="loadPage('cadastro-recurso.html')">Cadastrar</a></li>
            <li><a href="#" onclick="loadPage('recursos.html')">Listar</a></li>
          </ul>
        </li>
        <li><a href="#" onclick="loadPage('gerenciar-equipe.html')">Gerenciar Equipes</a></li>
      </ul>
    </aside>
    

    <main>
      <section id="conteudo">
        <!-- Conteúdo carregado dinamicamente vai aqui -->
      </section>
    </main>

    <div id="historicoModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <div class="div-left"><h2>Histórico do Projeto</h2></div>
          <div class="div-right">
            <button type="button" class="btn-close" onclick="fecharModal()">&times;</button>
          </div>
        </div>
        <div class="modal-body" id="historico-container"><!-- Histórico será carregado aqui --></div>
      </div>
    </div>

    <div id="recursosModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <div class="div-left"><h2>Recursos do Projeto</h2></div>
          <div class="div-right">
            <button type="button" class="btn-close" onclick="fecharModalRecursos()">&times;</button>
          </div>
        </div>
        <div class="modal-body" id="recursos-container"><!-- Os recursos serão carregados aqui --></div>
      </div>
    </div>

    <footer>
      <p>&copy; 2025 Gestão de Portfólio de Projetos</p>
    </footer>
  </div>

  <script src="js/projeto.js"></script>
  <script src="js/recurso.js"></script>
  <script src="js/equipe.js"></script>
  <script src="js/scripts.js"></script>
</body>
</html>
