<section>
    <h3>Gerenciar Equipe do Projeto</h3>
  
    <form id="formEquipe">

      <!-- Selecionar Projeto -->
      <div class="form-group">
        <label for="selectProjeto">Selecione o Projeto:</label>
        <select id="selectProjeto" required>
          <option value=""></option>
        </select>
      </div>

      <!-- Selecionar Recurso -->
      <div class="form-group">
        <label for="selectRecurso">Adicionar Recurso:</label>
        <select id="selectRecurso">
          <option value=""></option>
        </select>
      </div>

      <div class="form-group full-width ">
        <button type="submit" onclick="vincularRecursoProjeto()">Adicionar à Equipe</button>
      </div>
     

      <!-- Lista de Equipe do Projeto -->
      <div id="tabelaEquipeContainer" class="form-group full-width">
        <h4>Equipe do Projeto</h4>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>Papel</th>
              <th>Alocação</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabelaEquipeBody">
            <!-- Preenchido dinamicamente -->
          </tbody>
        </table>
      </div>

    </form>

  </section>
